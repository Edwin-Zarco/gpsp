# Builds the gpsp libretro core for Android 32-bit ARM (armeabi-v7a)
# using the project's own NDK build files in jni/ (Android.mk / Application.mk).
#
# Uses the NDK preinstalled on the runner (ANDROID_NDK_HOME), with no version pin,
# as the libretro docs recommend ("install the latest Android NDK").
# The library is named after the core: gpsp_libretro_android.so

name: Android armeabi-v7a

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CORE_NAME: gpsp

jobs:
  build-armeabi-v7a:
    name: Build (armeabi-v7a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show preinstalled NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
          cat "$ANDROID_NDK_HOME/source.properties"

      - name: Build core with ndk-build
        working-directory: jni
        run: |
          "$ANDROID_NDK_HOME/ndk-build" APP_ABI=armeabi-v7a -j"$(nproc)"

      - name: Collect output
        run: |
          echo "Contents of jni/libs/armeabi-v7a:"
          ls -la jni/libs/armeabi-v7a/ || true
          so=$(find jni/libs/armeabi-v7a -maxdepth 1 -name '*.so' | head -n1)
          if [ -z "$so" ]; then
            echo "ERROR: ndk-build produced no .so file. See the Build core step above." >&2
            exit 1
          fi
          mkdir -p dist
          cp "$so" "dist/${CORE_NAME}_libretro_android.so"
          file "dist/${CORE_NAME}_libretro_android.so"
          readelf -h "dist/${CORE_NAME}_libretro_android.so" | grep -E 'Class|Machine'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CORE_NAME }}_libretro_android_armeabi-v7a
          path: dist/${{ env.CORE_NAME }}_libretro_android.so
          if-no-files-found: error
