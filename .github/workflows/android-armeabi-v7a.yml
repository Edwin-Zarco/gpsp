name: Android armeabi-v7a

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CORE_NAME: gpsp
  NDK_VERSION: r23c

jobs:
  build-armeabi-v7a:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        id: cache-ndk
        with:
          path: ${{ runner.temp }}/android-ndk-${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}-linux

      - if: steps.cache-ndk.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          curl -fL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q ndk.zip && rm ndk.zip

      - run: echo "ANDROID_NDK_HOME=${RUNNER_TEMP}/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      - working-directory: jni
        run: |
          "$ANDROID_NDK_HOME/ndk-build" APP_ABI=armeabi-v7a -j"$(nproc)" \
            APP_CFLAGS="-O3 -fomit-frame-pointer" \
            APP_CPPFLAGS="-O3 -fomit-frame-pointer"

      - run: |
          so=$(find "$GITHUB_WORKSPACE" -path '*/libs/armeabi-v7a/*.so' | head -n1)
          mkdir -p dist
          cp "$so" "dist/${CORE_NAME}_libretro_android.so"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CORE_NAME }}_libretro_android_armeabi-v7a
          path: dist/${{ env.CORE_NAME }}_libretro_android.so
          if-no-files-found: error
